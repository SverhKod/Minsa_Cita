<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Registro</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden fade-in" style="max-width:384px;margin:0 auto;">

    <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-200">
      <button onclick="window.location.href='login-ciudadano.html'" class="text-gray-600">←</button>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6">
      <h1 class="text-xl font-extrabold text-gray-800 mb-1">Registro de Ciudadano</h1>
      <p class="text-gray-500 text-sm mb-6">Complete sus datos para crear una cuenta oficial.</p>

      <form id="formRegistro" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Tipo de Documento</label>
          <select id="tipoDoc" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
            <option value="DNI">DNI</option>
            <option value="CE">Carné de Extranjería</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Número de Documento</label>
          <input id="numDoc" type="text" maxlength="12" placeholder="Ej: 12345678"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
          <p class="text-xs text-gray-400 mt-1">Ingrese el número sin espacios ni guiones.</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
          <input id="nombre" type="text" placeholder="Nombres y Apellidos"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
          <input id="correo" type="email" placeholder="ejemplo@correo.com"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Crear Contraseña</label>
          <div class="relative">
            <input id="password" type="password" placeholder="••••••••"
              class="w-full border border-gray-300 rounded-lg px-3 pr-9 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">👁</button>
          </div>
          <div class="h-1.5 rounded-full bg-gray-200 mt-2 overflow-hidden">
            <div id="fuerzaBar" class="h-full bg-red-400 transition-all" style="width: 10%"></div>
          </div>
          <p class="text-xs text-gray-400 mt-1">La contraseña debe tener al menos 8 caracteres, números y letras.</p>
        </div>

        <label class="flex items-start gap-2 text-sm text-gray-600">
          <input type="checkbox" id="aceptaTerminos" class="mt-1 rounded border-gray-300">
          <span>
            Declaro que la información proporcionada es verdadera y acepto los
            <a href="#" class="text-blue-700 font-semibold hover:underline">Términos y Condiciones</a>
            y la
            <a href="#" class="text-blue-700 font-semibold hover:underline">Política de Privacidad</a>
            del Minsa.
          </span>
        </label>

        <p id="errorMsg" class="text-sm text-red-600 hidden"></p>

        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 flex items-center justify-center gap-2">
          CREAR CUENTA OFICIAL →
        </button>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    document.getElementById("password").addEventListener("input", (e) => {
      const val = e.target.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[a-zA-Z]/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;
      const pct = (score / 4) * 100;
      const bar = document.getElementById("fuerzaBar");
      bar.style.width = pct + "%";
      bar.className =
        "h-full transition-all " +
        (score <= 1 ? "bg-red-400" : score <= 2 ? "bg-yellow-400" : score <= 3 ? "bg-blue-400" : "bg-green-500");
    });

    document.getElementById("formRegistro").addEventListener("submit", function (e) {
      e.preventDefault();
      const errorEl = document.getElementById("errorMsg");
      errorEl.classList.add("hidden");

      const numDoc = document.getElementById("numDoc").value.trim();
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;
      const acepta = document.getElementById("aceptaTerminos").checked;

      if (!numDoc || !nombre || !correo || !password) {
        errorEl.textContent = "Complete todos los campos.";
        errorEl.classList.remove("hidden");
        return;
      }
      if (password.length < 8) {
        errorEl.textContent = "La contraseña debe tener al menos 8 caracteres.";
        errorEl.classList.remove("hidden");
        return;
      }
      if (!acepta) {
        errorEl.textContent = "Debe aceptar los Términos y la Política de Privacidad.";
        errorEl.classList.remove("hidden");
        return;
      }

      DB.guardarUsuario({ dni: numDoc, nombre, correo, password, telefono: "" });
      DB.login("ciudadano", { dni: numDoc });
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
