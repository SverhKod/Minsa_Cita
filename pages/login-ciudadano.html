<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinsaCita - Identificación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 md:p-10 flex-1 overflow-y-auto flex flex-col justify-center">
      <div class="bg-blue-50 text-blue-900 text-xs font-semibold text-center rounded-md py-2 mb-6">
        [PASO 1 DE 5: IDENTIFICACIÓN]
      </div>

      <form id="formLogin" class="space-y-5 max-w-lg mx-auto w-full">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Número de Documento (DNI/CE)</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4z" opacity="0"/><path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h9l5-5V4a2 2 0 0 0-2-2H6zm0 2h12v10h-4v4H6V4z"/></svg>
            </span>
            <input id="dni" type="text" maxlength="8" placeholder="Ingrese su documento"
              class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
          </div>
          <p class="text-xs text-gray-400 mt-1">Solo números o letras según corresponda.</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7z"/></svg>
            </span>
            <input id="password" type="password" placeholder="Ingrese su contraseña"
              class="w-full border border-gray-300 rounded-lg pl-9 pr-9 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <label class="flex items-center gap-2 text-sm text-gray-600">
          <input type="checkbox" id="recuerdame" class="rounded border-gray-300">
          Recuerda mi cuenta
        </label>

        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
          <p class="text-sm font-semibold text-gray-700 mb-2 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-gray-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
            </svg>
             Validación de Seguridad
          </p>
          <div class="flex items-center justify-between bg-white border border-gray-200 rounded-md py-2 px-3 mb-2">
            <span id="captchaText" class="tracking-widest font-mono text-gray-500 line-through select-none"></span>
            <button type="button" onclick="refrescarCaptcha()" class="text-gray-500 hover:text-blue-900 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
              </svg>
            </button>
          </div>
          <input id="captchaInput" type="text" placeholder="INGRESE EL CÓDIGO"
            class="w-full border border-gray-300 rounded-lg px-3 py-3 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
        </div>

        <p id="errorMsg" class="text-sm text-red-600 hidden"></p>

        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 transition-colors hover:shadow-md">
          INGRESAR
        </button>
      </form>

      <div class="text-center mt-4 space-y-1">
        <p><a href="registro.html" class="text-blue-700 text-sm font-semibold hover:underline">Regístrate aquí</a></p>
        <p><a href="recuperar-acceso.html" class="text-blue-700 text-sm hover:underline">¿Olvidaste tu contraseña?</a></p>
      </div>

      <button onclick="App.mostrarSoporte()" class="text-center text-xs text-gray-400 mt-6 flex items-center justify-center gap-1 hover:text-blue-900 transition-colors mx-auto">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.436 3 11.998c0 4.557 4.03 8.252 9 8.252zm0 0c1.786 0 3.443-.538 4.81-1.455M12 20.25v-3.75m0 3.75A9.92 9.92 0 017.19 18.8m4.81 1.45V16.5m0-4.5c.828 0 1.5.672 1.5 1.5M12 12c-.828 0-1.5.672-1.5 1.5" />
        </svg>
        Soporte Técnico MINSA
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let captchaActual = "";

    function refrescarCaptcha() {
      captchaActual = App.generarCaptcha();
      document.getElementById("captchaText").textContent = captchaActual;
    }

    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    function mostrarError(msg) {
      const el = document.getElementById("errorMsg");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function verificarBloqueo() {
      const intentos = DB.getIntentos();
      if (intentos.bloqueadoHasta && intentos.bloqueadoHasta > Date.now()) {
        window.location.href = "bloqueado.html";
      } else if (intentos.bloqueadoHasta && intentos.bloqueadoHasta <= Date.now()) {
        DB.resetIntentos();
      }
    }

    verificarBloqueo();
    refrescarCaptcha();

    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("errorMsg").classList.add("hidden");

      const dni = document.getElementById("dni").value.trim();
      const password = document.getElementById("password").value;
      const captchaInput = document.getElementById("captchaInput").value.trim().toUpperCase();

      if (!dni || !password) {
        mostrarError("Complete su documento y contraseña.");
        return;
      }

      if (captchaInput !== captchaActual) {
        mostrarError("El código de seguridad no coincide.");
        refrescarCaptcha();
        return;
      }

      // Simulación: cualquier usuario registrado con esa contraseña (o demo: 12345678 / 1234)
      const usuario = DB.getUsuarioPorDni(dni);
      const esDemo = dni === "12345678" && password === "1234";
      const esValido = esDemo || (usuario && usuario.password === password);

      if (!esValido) {
        const intentos = DB.registrarIntentoFallido();
        if (intentos.bloqueadoHasta) {
          window.location.href = "bloqueado.html";
          return;
        }
        mostrarError(`Documento o contraseña incorrectos. Intento ${intentos.fallidos} de 3.`);
        refrescarCaptcha();
        return;
      }

      DB.resetIntentos();
      DB.guardarUsuario(usuario || { dni, nombre: "Juan Pérez", password });
      DB.login("ciudadano", { dni });
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
