<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Panel Técnico</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-5xl mx-auto bg-gray-100 min-h-screen md:min-h-[80vh] md:rounded-xl shadow-md overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="bg-white flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <div class="md:col-span-1 space-y-4">
          <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
            <p class="font-bold text-gray-800">Usuario Técnico: <span id="nombreTec"></span></p>
            <p class="text-sm text-gray-500 flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-gray-400">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
              </svg>
              Consultorio <span id="consultorioTec"></span>
            </p>
            <p class="text-sm text-gray-500" id="fechaHoy"></p>
          </div>

          <div class="relative">
            <input id="buscador" type="text" placeholder="Buscar por DNI o Apellido"
              class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
              </svg>
            </span>
          </div>

          <div class="bg-white rounded-lg shadow-sm p-4 text-center hover:shadow-md transition-shadow">
            <button onclick="App.mostrarSoporte()" class="w-full text-center text-xs text-gray-400 flex items-center justify-center gap-1 hover:text-blue-900 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.436 3 11.998c0 4.557 4.03 8.252 9 8.252zm0 0c1.786 0 3.443-.538 4.81-1.455M12 20.25v-3.75m0 3.75A9.92 9.92 0 017.19 18.8m4.81 1.45V16.5m0-4.5c.828 0 1.5.672 1.5 1.5M12 12c-.828 0-1.5.672-1.5 1.5" />
              </svg>
              Soporte Técnico MINSA
            </button>
            <p class="text-xs text-gray-500 mt-1">¿Necesitas ayuda con el sistema? Nuestro equipo está disponible para asistirte.</p>
          </div>
        </div>

        <div class="md:col-span-2">
          <p class="font-bold text-gray-700 mb-2">Cola de Pacientes del Día</p>
          <div id="lista" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
          <p id="contador" class="text-center text-xs text-gray-400 mt-3"></p>
        </div>

      </div>
    </div>

    <div class="bg-blue-900 grid grid-cols-3 text-white text-xs md:text-sm shrink-0">
      <button onclick="window.location.href='tecnico-inicio.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Inicio
      </button>
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        Dashboard
      </button>
      <button onclick="window.location.href='perfil-tecnico.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        Perfil
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("tecnico", "login-especialista.html");
    let textoBusqueda = "";

    const iconId = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 inline-block text-gray-400"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z" /></svg>`;
    const iconCheck = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 inline-block"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`;

    if (sesion) {
      const tecnico = DB.getTecnicoPorCodigo(sesion.datos.codigo);
      document.getElementById("nombreTec").textContent = tecnico ? tecnico.nombre : "";
      document.getElementById("consultorioTec").textContent = tecnico ? tecnico.consultorio : "";
      document.getElementById("fechaHoy").textContent = App.formatoFechaLarga(new Date());

      render();

      document.getElementById("buscador").addEventListener("input", (e) => {
        textoBusqueda = e.target.value.trim().toLowerCase();
        render();
      });
    }

    function render() {
      const todos = DB.getColaPacientes();
      const filtrados = todos.filter((p) => {
        if (!textoBusqueda) return true;
        return (
          p.dni.toLowerCase().includes(textoBusqueda) ||
          p.nombre.toLowerCase().includes(textoBusqueda)
        );
      });

      const cont = document.getElementById("lista");

      if (filtrados.length === 0) {
        cont.innerHTML = `<p class="text-gray-400 text-sm bg-white rounded-lg p-4 text-center col-span-full">No se encontraron pacientes con ese criterio.</p>`;
        document.getElementById("contador").textContent = `Mostrando 0 de ${todos.length} pacientes`;
        return;
      }

      cont.innerHTML = filtrados.map((p) => {
        const badge =
          p.estado === "espera"
            ? `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-yellow-100 text-yellow-700">EN ESPERA DE VALIDACIÓN</span>`
            : p.estado === "ausente"
              ? `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-red-100 text-red-700">AUSENTE</span>`
              : `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700">VALIDADO</span>`;

        const boton =
          p.estado === "espera"
            ? `<button onclick="validar(event, '${p.dni}')" class="w-full bg-blue-900 hover:bg-blue-800 text-white text-sm font-semibold rounded-lg py-2 transition-colors hover:shadow-md flex items-center justify-center gap-1">${iconCheck} VALIDAR</button>`
            : `<button disabled class="w-full border border-gray-200 text-gray-400 text-sm font-semibold rounded-lg py-2">${p.estado === "ausente" ? "AUSENTE" : "VALIDADO"}</button>`;

        return `
        <div class="bg-white rounded-lg shadow-sm p-4 cursor-pointer hover:shadow-md transition-shadow" onclick="irFicha('${p.dni}')">
          <div class="flex items-start justify-between mb-1">
            <p class="text-xs text-gray-400">Hora Asignada</p>
            ${badge}
          </div>
          <p class="font-bold text-blue-900">${String(p.orden).padStart(2,"0")} &nbsp; ${p.hora}</p>
          <p class="font-semibold text-gray-800">${p.nombre}</p>
          <p class="text-xs text-gray-400 mb-3 flex items-center gap-1">${iconId} DNI: ${p.dni}</p>
          <div onclick="event.stopPropagation()">${boton}</div>
        </div>`;
      }).join("");

      document.getElementById("contador").textContent = `Mostrando 1-${filtrados.length} de ${todos.length} pacientes`;
    }

    function validar(event, dni) {
      event.stopPropagation();
      DB.actualizarPacienteEnCola(dni, { estado: "validado" });
      render();
    }

    function irFicha(dni) {
      window.location.href = "ficha-atencion.html?dni=" + encodeURIComponent(dni);
    }

    function cerrarSesion() {
      App.cerrarSesion("../index.html");
    }
  </script>
</body>
</html>
