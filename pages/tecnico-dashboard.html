<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Panel Técnico</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm mx-auto bg-gray-100 h-[700px] flex flex-col overflow-hidden rounded-xl shadow-md">

    <div class="bg-white flex items-center gap-2 px-4 py-3 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="font-bold text-gray-800">Usuario Técnico: <span id="nombreTec"></span></p>
        <p class="text-sm text-gray-500">📍 Consultorio <span id="consultorioTec"></span></p>
        <p class="text-sm text-gray-500" id="fechaHoy"></p>
      </div>

      <div class="relative">
        <input id="buscador" type="text" placeholder="Buscar por DNI o Apellido"
          class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-800">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
      </div>

      <div>
        <p class="font-bold text-gray-700 mb-2">Cola de Pacientes del Día</p>
        <div id="lista" class="space-y-3"></div>
        <p id="contador" class="text-center text-xs text-gray-400 mt-3"></p>
      </div>

      <div class="bg-white rounded-lg shadow-sm p-4 text-center">
        <button onclick="App.mostrarSoporte()" class="w-full text-center text-xs text-gray-400 mt-6 flex items-center justify-center gap-1 hover:text-blue-900">
        🎧 Soporte Técnico MINSA
      </button>        <p class="text-xs text-gray-500">¿Necesitas ayuda con el sistema? Nuestro equipo está disponible para asistirte.</p>
      </div>
    </div>

    <div class="bg-blue-900 grid grid-cols-3 text-white text-xs shrink-0">
    <button onclick="window.location.href='tecnico-inicio.html'" class="py-3 flex flex-col items-center gap-1"><span>🏠</span>Inicio</button>      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40"><span>📊</span>Dashboard</button>
    <button onclick="window.location.href='perfil-tecnico.html'" class="py-3 flex flex-col items-center gap-1"><span>👤</span>Perfil</button>    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("tecnico", "login-especialista.html");
    let textoBusqueda = "";

    if (sesion) {
      const tecnico = DB.getTecnicoPorCodigo(sesion.datos.codigo);
      document.getElementById("nombreTec").textContent = tecnico ? tecnico.nombre : "";
      document.getElementById("consultorioTec").textContent = tecnico ? tecnico.consultorio : "";
      document.getElementById("fechaHoy").textContent = App.formatoFechaLarga(new Date());

      render();

      document.getElementById("buscador").addEventListener("input", (e) => {
        textoBusqueda = e.target.value.trim().toLowerCase();
        render();
      });
    }

    function render() {
      const todos = DB.getColaPacientes();
      const filtrados = todos.filter((p) => {
        if (!textoBusqueda) return true;
        return (
          p.dni.toLowerCase().includes(textoBusqueda) ||
          p.nombre.toLowerCase().includes(textoBusqueda)
        );
      });

      const cont = document.getElementById("lista");

      if (filtrados.length === 0) {
        cont.innerHTML = `<p class="text-gray-400 text-sm bg-white rounded-lg p-4 text-center">No se encontraron pacientes con ese criterio.</p>`;
        document.getElementById("contador").textContent = `Mostrando 0 de ${todos.length} pacientes`;
        return;
      }

      cont.innerHTML = filtrados.map((p) => {
        const badge =
          p.estado === "espera"
            ? `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-yellow-100 text-yellow-700">EN ESPERA DE VALIDACIÓN</span>`
            : p.estado === "ausente"
              ? `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-red-100 text-red-700">AUSENTE</span>`
              : `<span class="text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-700">VALIDADO</span>`;

        const boton =
          p.estado === "espera"
            ? `<button onclick="validar(event, '${p.dni}')" class="w-full bg-blue-900 hover:bg-blue-800 text-white text-sm font-semibold rounded-lg py-2">✓ VALIDAR</button>`
            : `<button disabled class="w-full border border-gray-200 text-gray-400 text-sm font-semibold rounded-lg py-2">${p.estado === "ausente" ? "AUSENTE" : "VALIDADO"}</button>`;

        return `
        <div class="bg-white rounded-lg shadow-sm p-4 cursor-pointer" onclick="irFicha('${p.dni}')">
          <div class="flex items-start justify-between mb-1">
            <p class="text-xs text-gray-400">Hora Asignada</p>
            ${badge}
          </div>
          <p class="font-bold text-blue-900">${String(p.orden).padStart(2,"0")} &nbsp; ${p.hora}</p>
          <p class="font-semibold text-gray-800">${p.nombre}</p>
          <p class="text-xs text-gray-400 mb-3">🆔 DNI: ${p.dni}</p>
          <div onclick="event.stopPropagation()">${boton}</div>
        </div>`;
      }).join("");

      document.getElementById("contador").textContent = `Mostrando 1-${filtrados.length} de ${todos.length} pacientes`;
    }

    function validar(event, dni) {
      event.stopPropagation();
      DB.actualizarPacienteEnCola(dni, { estado: "validado" });
      render();
    }

    function irFicha(dni) {
      window.location.href = "ficha-atencion.html?dni=" + encodeURIComponent(dni);
    }

    function cerrarSesion() {
      App.cerrarSesion("../index.html");
    }
  </script>
</body>
</html>
