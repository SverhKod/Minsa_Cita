<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Confirmación</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden fade-in flex flex-col" style="max-width:384px;margin:0 auto;" style="min-height: 600px;">

    <div class="flex-1 p-6">
      <h1 class="text-lg font-extrabold text-gray-800 mb-3">Resumen y Confirmación</h1>

      <div class="flex items-center justify-between text-xs mb-6">
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">1</span>
        <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">2</span>
        <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">3</span>
        <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">4</span>
        <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
        <span class="text-blue-900 font-semibold whitespace-nowrap">5 Confirmación</span>
      </div>

      <p class="text-gray-500 text-sm mb-4">Por favor, revise los detalles de su cita médica antes de confirmar.</p>

      <div class="border border-gray-200 rounded-lg p-4 mb-4">
        <p class="text-blue-900 font-bold mb-3">Detalles de la Cita</p>
        <div class="space-y-3 text-sm">
          <div>
            <p class="text-gray-400 text-xs flex items-center gap-1">🏥 Establecimiento</p>
            <p id="sedeTxt" class="font-semibold text-gray-800"></p>
          </div>
          <div>
            <p class="text-gray-400 text-xs flex items-center gap-1">➕ Especialidad</p>
            <p id="especialidadTxt" class="font-semibold text-gray-800"></p>
          </div>
          <div>
            <p class="text-gray-400 text-xs flex items-center gap-1">👤 Médico</p>
            <p id="medicoTxt" class="font-semibold text-gray-800"></p>
          </div>
          <div>
            <p class="text-gray-400 text-xs flex items-center gap-1">📅 Fecha y Hora</p>
            <p id="fechaHoraTxt" class="font-semibold text-gray-800"></p>
          </div>
        </div>
      </div>

      <div class="bg-blue-50 text-blue-900 text-sm rounded-lg p-3 flex gap-2 mb-4">
        <span>ℹ️</span>
        <span>Recuerde asistir 30 minutos antes de la hora programada con su DNI en físico.</span>
      </div>

      <p id="errorMsg" class="text-sm text-red-600 hidden mb-3"></p>

      <div class="space-y-3">
        <button onclick="cancelar()" class="w-full border border-gray-300 text-gray-600 font-semibold rounded-lg py-3">
          Cancelar
        </button>
        <button onclick="confirmar()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3">
          CONFIRMAR Y AGENDAR CITA EN EL SISTEMA
        </button>
      </div>
    </div>

    <!-- Bottom nav -->
    <div class="bg-blue-900 grid grid-cols-4 text-white text-xs">
      <button onclick="window.location.href='dashboard.html'" class="py-3 flex flex-col items-center gap-1">
        <span>🏠</span>Inicio
      </button>
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40">
        <span>➕</span>Nueva Cita
      </button>
      <button onclick="window.location.href='mis-citas.html'" class="py-3 flex flex-col items-center gap-1">
        <span>🗓️</span>Mis Citas
      </button>
      <button onclick="window.location.href='perfil.html'" class="py-3 flex flex-col items-center gap-1">
        <span>👤</span>Perfil
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("ciudadano", "login-ciudadano.html");
    const wizard = DB.getWizard();
    if (!wizard.hora) window.location.href = "nueva-cita-paso4.html";

    const sede = DB.getSedePorId(wizard.sedeId);
    const especialidad = DB.getEspecialidadPorId(wizard.especialidadId);
    const medico = DB.getMedicoPorId(wizard.medicoId);

    document.getElementById("sedeTxt").textContent = sede ? sede.nombre : "";
    document.getElementById("especialidadTxt").textContent = especialidad ? especialidad.nombre : "";
    document.getElementById("medicoTxt").textContent = medico ? medico.nombre : "";
    document.getElementById("fechaHoraTxt").textContent = `${wizard.fecha}, ${wizard.hora}`;

    function cancelar() {
      DB.limpiarWizard();
      window.location.href = "dashboard.html";
    }

    function confirmar() {
      if (!sesion) return;
      const cita = DB.crearCita({
        dniPaciente: sesion.datos.dni,
        sedeId: wizard.sedeId,
        especialidadId: wizard.especialidadId,
        medicoId: wizard.medicoId,
        fecha: wizard.fecha,
        hora: wizard.hora,
        estado: "confirmada",
      });
      DB.guardarWizard({ codigoAtencion: `MIN-${Math.floor(1000 + Math.random() * 9000)}-A`, citaId: cita.id });
      window.location.href = "cita-exitosa.html";
    }
  </script>
</body>
</html>
