<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Confirmación</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-5xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex-1 p-6 md:p-10 overflow-y-auto">
      <div class="max-w-2xl mx-auto w-full">
        <h1 class="text-lg md:text-2xl font-extrabold text-gray-800 mb-3">Resumen y Confirmación</h1>

        <div class="flex items-center justify-between text-xs mb-6">
          <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">1</span>
          <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
          <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">2</span>
          <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
          <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">3</span>
          <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
          <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">4</span>
          <span class="flex-1 h-0.5 bg-blue-900 mx-1"></span>
          <span class="text-blue-900 font-semibold whitespace-nowrap">5 Confirmación</span>
        </div>

        <p class="text-gray-500 text-sm mb-4">Por favor, revise los detalles de su cita médica antes de confirmar.</p>

        <div class="border border-gray-200 rounded-lg p-4 md:p-6 mb-4">
          <p class="text-blue-900 font-bold mb-3">Detalles de la Cita</p>
          <div class="space-y-3 text-sm md:grid md:grid-cols-2 md:gap-4 md:space-y-0">
            <div>
              <p class="text-gray-400 text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z" />
                </svg>
                Establecimiento
              </p>
              <p id="sedeTxt" class="font-semibold text-gray-800"></p>
            </div>
            <div>
              <p class="text-gray-400 text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Especialidad
              </p>
              <p id="especialidadTxt" class="font-semibold text-gray-800"></p>
            </div>
            <div>
              <p class="text-gray-400 text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                Médico
              </p>
              <p id="medicoTxt" class="font-semibold text-gray-800"></p>
            </div>
            <div>
              <p class="text-gray-400 text-xs flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                </svg>
                Fecha y Hora
              </p>
              <p id="fechaHoraTxt" class="font-semibold text-gray-800"></p>
            </div>
          </div>
        </div>

        <div class="bg-blue-50 text-blue-900 text-sm rounded-lg p-3 flex gap-2 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0 mt-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
          </svg>
          <span>Recuerde asistir 30 minutos antes de la hora programada con su DNI en físico.</span>
        </div>

        <p id="errorMsg" class="text-sm text-red-600 hidden mb-3"></p>

        <div class="space-y-3 md:flex md:flex-row-reverse md:gap-3 md:space-y-0">
          <button onclick="confirmar()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 transition-colors hover:shadow-md">
            CONFIRMAR Y AGENDAR CITA EN EL SISTEMA
          </button>
          <button onclick="cancelar()" class="w-full border border-gray-300 text-gray-600 font-semibold rounded-lg py-3 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom nav -->
    <div class="bg-blue-900 grid grid-cols-4 text-white text-xs md:text-sm shrink-0">
      <button onclick="window.location.href='dashboard.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Inicio
      </button>
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nueva Cita
      </button>
      <button onclick="window.location.href='mis-citas.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
        </svg>
        Mis Citas
      </button>
      <button onclick="window.location.href='perfil.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        Perfil
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("ciudadano", "login-ciudadano.html");
    const wizard = DB.getWizard();
    if (!wizard.hora) window.location.href = "nueva-cita-paso4.html";

    const sede = DB.getSedePorId(wizard.sedeId);
    const especialidad = DB.getEspecialidadPorId(wizard.especialidadId);
    const medico = DB.getMedicoPorId(wizard.medicoId);

    document.getElementById("sedeTxt").textContent = sede ? sede.nombre : "";
    document.getElementById("especialidadTxt").textContent = especialidad ? especialidad.nombre : "";
    document.getElementById("medicoTxt").textContent = medico ? medico.nombre : "";
    document.getElementById("fechaHoraTxt").textContent = `${wizard.fecha}, ${wizard.hora}`;

    function cancelar() {
      DB.limpiarWizard();
      window.location.href = "dashboard.html";
    }

    function confirmar() {
      if (!sesion) return;
      const cita = DB.crearCita({
        dniPaciente: sesion.datos.dni,
        sedeId: wizard.sedeId,
        especialidadId: wizard.especialidadId,
        medicoId: wizard.medicoId,
        fecha: wizard.fecha,
        hora: wizard.hora,
        estado: "confirmada",
      });
      DB.guardarWizard({ codigoAtencion: `MIN-${Math.floor(1000 + Math.random() * 9000)}-A`, citaId: cita.id });
      window.location.href = "cita-exitosa.html";
    }
  </script>
</body>
</html>
