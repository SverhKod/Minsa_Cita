<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Cita Reservada</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">
    <div class="p-8 md:p-12 text-center flex-1 flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">
        <div class="mx-auto mb-5 bg-blue-900 text-white rounded-xl w-16 h-16 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </div>

        <h1 class="text-xl md:text-2xl font-extrabold text-gray-800 mb-2">¡CITA RESERVADA EXITOSAMENTE!</h1>
        <p class="text-gray-500 text-sm mb-6">Su solicitud ha sido procesada. Por favor, conserve el código de atención para presentar en admisión el día de su cita.</p>

        <div class="bg-gray-50 border border-gray-200 rounded-lg py-4 mb-6">
          <p class="text-xs text-gray-500 font-semibold mb-1">CÓDIGO DE ATENCIÓN</p>
          <p id="codigo" class="text-2xl font-mono font-bold text-blue-900"></p>
        </div>

        <button onclick="descargarTicket()" class="w-full border border-gray-300 text-gray-700 font-semibold rounded-lg py-3 mb-3 flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          DESCARGAR TICKET (PDF)
        </button>
        <button onclick="finalizar()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 transition-colors hover:shadow-md">
          FINALIZAR Y SALIR
        </button>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script>
    const wizard = DB.getWizard();
    document.getElementById("codigo").textContent = wizard.codigoAtencion || "MIN-0000-A";

    function descargarTicket() {
      const contenido = `MINSACITA - TICKET DE ATENCIÓN\nCódigo: ${wizard.codigoAtencion}\nFecha: ${wizard.fecha}\nHora: ${wizard.hora}\n\n(Simulación: en un proyecto real esto generaría un PDF)`;
      const blob = new Blob([contenido], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ticket-${wizard.codigoAtencion || "minsacita"}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function finalizar() {
      DB.limpiarWizard();
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
