<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Sin Conexión</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-8 md:p-12 text-center flex-1 flex flex-col justify-center">
      <div class="max-w-md mx-auto w-full">
        <div class="mx-auto mb-5 bg-red-100 rounded-lg w-16 h-16 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-red-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
          </svg>
        </div>
        <h1 class="font-extrabold text-gray-800 text-xl md:text-2xl mb-3">Sin conexión a internet</h1>
        <p class="text-gray-500 text-sm mb-6 leading-relaxed">
          No hemos podido comunicarnos con los servidores del MINSA. Por favor, verifica tu conexión de red o el estado de tus datos móviles.
        </p>

        <button onclick="reintentar()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 mb-3 transition-colors hover:shadow-md flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
          </svg>
          Reintentar
        </button>
        <button onclick="window.location.href='../index.html'" class="w-full border border-gray-300 text-gray-700 font-semibold rounded-lg py-3 hover:bg-gray-50 transition-colors">
          Volver al Inicio
        </button>

        <p class="text-xs text-gray-400 mt-6 flex items-center justify-center gap-1">
          <span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> SISTEMA DESCONECTADO
        </p>
      </div>
    </div>
  </div>

  <script>
    function reintentar() {
      if (navigator.onLine) {
        window.location.href = "../index.html";
      } else {
        alert("Seguimos sin conexión. Inténtelo nuevamente en unos segundos.");
      }
    }
  </script>
</body>
</html>
