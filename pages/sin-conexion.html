<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Sin Conexión</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden fade-in" style="max-width:384px;margin:0 auto;">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-8 text-center">
      <div class="mx-auto mb-5 bg-red-100 rounded-lg w-16 h-16 flex items-center justify-center text-3xl">📶</div>
      <h1 class="font-extrabold text-gray-800 text-xl mb-3">Sin conexión a internet</h1>
      <p class="text-gray-500 text-sm mb-6 leading-relaxed">
        No hemos podido comunicarnos con los servidores del MINSA. Por favor, verifica tu conexión de red o el estado de tus datos móviles.
      </p>

      <button onclick="reintentar()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 mb-3">
        ↻ Reintentar
      </button>
      <button onclick="window.location.href='../index.html'" class="w-full border border-gray-300 text-gray-700 font-semibold rounded-lg py-3">
        Volver al Inicio
      </button>

      <p class="text-xs text-gray-400 mt-6 flex items-center justify-center gap-1">
        <span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> SISTEMA DESCONECTADO
      </p>
    </div>
  </div>

  <script>
    function reintentar() {
      if (navigator.onLine) {
        window.location.href = "../index.html";
      } else {
        alert("Seguimos sin conexión. Inténtelo nuevamente en unos segundos.");
      }
    }
  </script>
</body>
</html>
