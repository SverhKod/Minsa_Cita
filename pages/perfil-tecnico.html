<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Perfil Técnico</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm mx-auto bg-gray-100 h-[700px] flex flex-col overflow-hidden rounded-xl shadow-md">

    <div class="bg-white flex items-center gap-2 px-4 py-3 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">

      <!-- Avatar y datos principales -->
      <div class="bg-white rounded-lg shadow-sm p-6 text-center">
        <div id="avatar" class="mx-auto mb-3 bg-blue-900 text-white rounded-full w-16 h-16 flex items-center justify-center font-bold text-xl"></div>
        <p id="nombre" class="font-bold text-gray-800 text-lg"></p>
        <p id="codigo" class="text-gray-400 text-sm"></p>
        <span class="inline-block mt-2 text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-900">
          Personal Técnico
        </span>
      </div>

      <!-- Datos de asignación -->
      <div class="bg-white rounded-lg shadow-sm divide-y divide-gray-100">
        <div class="p-4">
          <p class="text-xs text-gray-400">Consultorio Asignado</p>
          <p id="consultorio" class="text-gray-800 font-medium"></p>
        </div>
        <div class="p-4">
          <p class="text-xs text-gray-400">Establecimiento</p>
          <p id="establecimiento" class="text-gray-800 font-medium">Hospital Nacional Dos de Mayo</p>
        </div>
        <div class="p-4">
          <p class="text-xs text-gray-400">Turno</p>
          <p class="text-gray-800 font-medium">Mañana (07:00 AM - 02:00 PM)</p>
        </div>
      </div>

      <!-- Resumen del día -->
      <div class="bg-white rounded-lg shadow-sm p-4">
        <p class="font-bold text-gray-700 mb-3">Resumen del Día</p>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div>
            <p id="totalPacientes" class="text-xl font-extrabold text-blue-900">0</p>
            <p class="text-xs text-gray-400">Total</p>
          </div>
          <div>
            <p id="totalValidados" class="text-xl font-extrabold text-green-600">0</p>
            <p class="text-xs text-gray-400">Validados</p>
          </div>
          <div>
            <p id="totalAusentes" class="text-xl font-extrabold text-red-500">0</p>
            <p class="text-xs text-gray-400">Ausentes</p>
          </div>
        </div>
      </div>

      <button onclick="App.mostrarSoporte()" class="w-full bg-white shadow-sm rounded-lg p-4 text-left flex items-center justify-between">
        <span class="font-semibold text-gray-700">🎧 Soporte Técnico MINSA</span><span>›</span>
      </button>

      <button onclick="cerrarSesion()" class="w-full border border-red-300 text-red-600 font-semibold rounded-lg py-3">
        Cerrar Sesión
      </button>
    </div>

    <!-- Bottom nav -->
    <div class="bg-blue-900 grid grid-cols-3 text-white text-xs shrink-0">
      <button onclick="window.location.href='tecnico-inicio.html'" class="py-3 flex flex-col items-center gap-1"><span>🏠</span>Inicio</button>
      <button onclick="window.location.href='tecnico-dashboard.html'" class="py-3 flex flex-col items-center gap-1"><span>📊</span>Dashboard</button>
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40"><span>👤</span>Perfil</button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("tecnico", "login-especialista.html");

    if (sesion) {
      const tecnico = DB.getTecnicoPorCodigo(sesion.datos.codigo);
      const nombre = tecnico ? tecnico.nombre : "Personal Técnico";

      document.getElementById("avatar").textContent = App.iniciales(nombre);
      document.getElementById("nombre").textContent = nombre;
      document.getElementById("codigo").textContent = "Código: " + (tecnico ? tecnico.codigo : sesion.datos.codigo);
      document.getElementById("consultorio").textContent = tecnico ? tecnico.consultorio : "—";

      const cola = DB.getColaPacientes();
      document.getElementById("totalPacientes").textContent = cola.length;
      document.getElementById("totalValidados").textContent = cola.filter((p) => p.estado === "validado").length;
      document.getElementById("totalAusentes").textContent = cola.filter((p) => p.estado === "ausente").length;
    }

    function cerrarSesion() {
      App.cerrarSesion("../index.html");
    }
  </script>
</body>
</html>
