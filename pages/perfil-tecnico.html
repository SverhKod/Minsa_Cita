<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Perfil Técnico</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-5xl mx-auto bg-gray-100 min-h-screen md:min-h-[80vh] md:rounded-xl shadow-md overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="bg-white flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">

        <div class="space-y-4">
          <!-- Avatar y datos principales -->
          <div class="bg-white rounded-lg shadow-sm p-6 text-center hover:shadow-md transition-shadow">
            <div id="avatar" class="mx-auto mb-3 bg-blue-900 text-white rounded-full w-16 h-16 flex items-center justify-center font-bold text-xl"></div>
            <p id="nombre" class="font-bold text-gray-800 text-lg"></p>
            <p id="codigo" class="text-gray-400 text-sm"></p>
            <span class="inline-block mt-2 text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-900">
              Personal Técnico
            </span>
          </div>

          <!-- Datos de asignación -->
          <div class="bg-white rounded-lg shadow-sm divide-y divide-gray-100 hover:shadow-md transition-shadow">
            <div class="p-4">
              <p class="text-xs text-gray-400">Consultorio Asignado</p>
              <p id="consultorio" class="text-gray-800 font-medium"></p>
            </div>
            <div class="p-4">
              <p class="text-xs text-gray-400">Establecimiento</p>
              <p id="establecimiento" class="text-gray-800 font-medium">Hospital Nacional Dos de Mayo</p>
            </div>
            <div class="p-4">
              <p class="text-xs text-gray-400">Turno</p>
              <p class="text-gray-800 font-medium">Mañana (07:00 AM - 02:00 PM)</p>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          <!-- Resumen del día -->
          <div class="bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow">
            <p class="font-bold text-gray-700 mb-3">Resumen del Día</p>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div>
                <p id="totalPacientes" class="text-xl font-extrabold text-blue-900">0</p>
                <p class="text-xs text-gray-400">Total</p>
              </div>
              <div>
                <p id="totalValidados" class="text-xl font-extrabold text-green-600">0</p>
                <p class="text-xs text-gray-400">Validados</p>
              </div>
              <div>
                <p id="totalAusentes" class="text-xl font-extrabold text-red-500">0</p>
                <p class="text-xs text-gray-400">Ausentes</p>
              </div>
            </div>
          </div>

          <button onclick="App.mostrarSoporte()" class="w-full bg-white shadow-sm rounded-lg p-4 text-left flex items-center justify-between hover:shadow-md transition-shadow">
            <span class="font-semibold text-gray-700 flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.436 3 11.998c0 4.557 4.03 8.252 9 8.252zm0 0c1.786 0 3.443-.538 4.81-1.455M12 20.25v-3.75m0 3.75A9.92 9.92 0 017.19 18.8m4.81 1.45V16.5m0-4.5c.828 0 1.5.672 1.5 1.5M12 12c-.828 0-1.5.672-1.5 1.5" />
              </svg>
              Soporte Técnico MINSA
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-400">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <button onclick="cerrarSesion()" class="w-full border border-red-300 text-red-600 font-semibold rounded-lg py-3 hover:bg-red-50 transition-colors">
            Cerrar Sesión
          </button>
        </div>

      </div>
    </div>

    <!-- Bottom nav -->
    <div class="bg-blue-900 grid grid-cols-3 text-white text-xs md:text-sm shrink-0">
      <button onclick="window.location.href='tecnico-inicio.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Inicio
      </button>
      <button onclick="window.location.href='tecnico-dashboard.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        Dashboard
      </button>
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        Perfil
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("tecnico", "login-especialista.html");

    if (sesion) {
      const tecnico = DB.getTecnicoPorCodigo(sesion.datos.codigo);
      const nombre = tecnico ? tecnico.nombre : "Personal Técnico";

      document.getElementById("avatar").textContent = App.iniciales(nombre);
      document.getElementById("nombre").textContent = nombre;
      document.getElementById("codigo").textContent = "Código: " + (tecnico ? tecnico.codigo : sesion.datos.codigo);
      document.getElementById("consultorio").textContent = tecnico ? tecnico.consultorio : "—";

      const cola = DB.getColaPacientes();
      document.getElementById("totalPacientes").textContent = cola.length;
      document.getElementById("totalValidados").textContent = cola.filter((p) => p.estado === "validado").length;
      document.getElementById("totalAusentes").textContent = cola.filter((p) => p.estado === "ausente").length;
    }

    function cerrarSesion() {
      App.cerrarSesion("../index.html");
    }
  </script>
</body>
</html>
