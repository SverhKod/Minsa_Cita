<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Perfil</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-5xl mx-auto bg-gray-100 min-h-screen md:min-h-[80vh] md:rounded-xl shadow-md overflow-hidden fade-in flex flex-col transition-all duration-300">

    <!-- Encabezado -->
    <div class="bg-white flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <!-- Contenido -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">

        <div class="space-y-4">
          <div class="bg-white rounded-lg shadow-sm p-6 text-center hover:shadow-md transition-shadow">
            <div id="avatar" class="mx-auto mb-3 bg-blue-900 text-white rounded-full w-16 h-16 flex items-center justify-center font-bold text-xl"></div>
            <p id="nombre" class="font-bold text-gray-800 text-lg"></p>
            <p id="dni" class="text-gray-400 text-sm"></p>
          </div>

          <div class="bg-white rounded-lg shadow-sm divide-y divide-gray-100 hover:shadow-md transition-shadow">
            <div class="p-4">
              <p class="text-xs text-gray-400">Correo Electrónico</p>
              <p id="correo" class="text-gray-800 font-medium"></p>
            </div>
            <div class="p-4">
              <p class="text-xs text-gray-400">Teléfono</p>
              <p id="telefono" class="text-gray-800 font-medium"></p>
            </div>
          </div>
        </div>

        <div class="space-y-4">
          <button onclick="window.location.href='ayuda.html'" class="w-full bg-white shadow-sm rounded-lg p-4 text-left flex items-center justify-between hover:shadow-md transition-shadow">
            <span class="font-semibold text-gray-700">Ayuda y Preguntas Frecuentes</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-400">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <button onclick="cerrarSesion()" class="w-full border border-red-300 text-red-600 font-semibold rounded-lg py-3 hover:bg-red-50 transition-colors">
            Cerrar Sesión
          </button>
        </div>

      </div>
    </div>

    <!-- Barra de Navegación Inferior con SVGs -->
    <div class="bg-blue-900 grid grid-cols-4 text-white text-xs md:text-sm shrink-0">
      
      <!-- Inicio -->
      <button onclick="window.location.href='dashboard.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Inicio
      </button>

      <!-- Nueva Cita -->
      <button onclick="window.location.href='nueva-cita-paso2.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Nueva Cita
      </button>

      <!-- Mis Citas -->
      <button onclick="window.location.href='mis-citas.html'" class="py-3 flex flex-col items-center gap-1 hover:bg-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
        </svg>
        Mis Citas
      </button>

      <!-- Perfil (Activo) -->
      <button class="py-3 flex flex-col items-center gap-1 bg-blue-950/40">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        Perfil
      </button>
      
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const sesion = App.requiereSesion("ciudadano", "login-ciudadano.html");
    if (sesion) {
      const usuario = DB.getUsuarioPorDni(sesion.datos.dni) || { nombre: "Ciudadano", dni: sesion.datos.dni };
      document.getElementById("avatar").textContent = App.iniciales(usuario.nombre || "MC");
      document.getElementById("nombre").textContent = usuario.nombre;
      document.getElementById("dni").textContent = "DNI: " + usuario.dni;
      document.getElementById("correo").textContent = usuario.correo || "No registrado";
      document.getElementById("telefono").textContent = usuario.telefono || "No registrado";
    }

    function cerrarSesion() {
      App.cerrarSesion("../index.html");
    }
  </script>
</body>
</html>
