<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Selección de Médico</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm mx-auto bg-white h-[700px] flex flex-col overflow-hidden rounded-xl shadow-md">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 flex-1 overflow-y-auto">
      <!-- Steps -->
      <div class="flex items-center gap-1 mb-6 text-xs">
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">✓</span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">✓</span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">3</span>
        <span class="flex-1 h-0.5 bg-gray-200"></span>
        <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">4</span>
        <span class="flex-1 h-0.5 bg-gray-200"></span>
        <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">5</span>
      </div>

      <h1 class="text-lg font-extrabold text-gray-800 mb-1">Paso 3 de 5: Selección de Médico</h1>
      <p class="text-gray-500 text-sm mb-5">Elija al profesional de salud que le atenderá.</p>

      <div id="listaMedicos" class="space-y-4"></div>

      <p id="errorMsg" class="text-sm text-red-600 hidden mt-2"></p>

      <button onclick="window.location.href='nueva-cita-paso2.html'" class="w-full text-gray-600 font-semibold rounded-lg py-3 border border-gray-200 mt-4">
        ← Volver
      </button>

      <button onclick="App.mostrarSoporte()" class="w-full text-center text-xs text-gray-400 mt-6 flex items-center justify-center gap-1 hover:text-blue-900">
        🎧 Soporte Técnico MINSA
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    App.requiereSesion("ciudadano", "login-ciudadano.html");
    const wizard = DB.getWizard();
    if (!wizard.especialidadId) window.location.href = "nueva-cita-paso2.html";

    const medicos = DB.getMedicosPorEspecialidad(wizard.especialidadId);
    const especialidad = DB.getEspecialidadPorId(wizard.especialidadId);
    const cont = document.getElementById("listaMedicos");

    if (medicos.length === 0) {
      cont.innerHTML = `<p class="text-gray-400 text-sm text-center py-8">No hay médicos disponibles para esta especialidad por el momento.</p>`;
    } else {
      cont.innerHTML = medicos
        .map(
          (m) => `
        <div class="border border-gray-200 rounded-lg overflow-hidden">
          ${
            m.foto
              ? `<img src="${m.foto}" class="w-full h-40 object-cover" alt="${m.nombre}">`
              : `<div class="w-full h-40 bg-gray-100 flex items-center justify-center text-5xl text-gray-300">👤</div>`
          }
          <div class="p-4">
            <p class="font-bold text-gray-800">${m.nombre}</p>
            <p class="text-sm text-gray-500 mb-1">Especialidad: ${especialidad ? especialidad.nombre : ""}</p>
            <p class="text-sm text-gray-500 mb-3">🏢 Consultorio ${m.consultorio}</p>
            <button onclick="elegirMedico('${m.id}')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg py-2.5">
              Elegir Médico →
            </button>
          </div>
        </div>`
        )
        .join("");
    }

    function elegirMedico(medicoId) {
      DB.guardarWizard({ medicoId });
      window.location.href = "nueva-cita-paso4.html";
    }
  </script>
</body>
</html>
