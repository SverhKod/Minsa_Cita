<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Selección de Médico</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-5xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 md:p-10 flex-1 overflow-y-auto">
      <!-- Steps -->
      <div class="flex items-center gap-1 mb-6 text-xs max-w-lg">
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        </span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        </span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">3</span>
        <span class="flex-1 h-0.5 bg-gray-200"></span>
        <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">4</span>
        <span class="flex-1 h-0.5 bg-gray-200"></span>
        <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">5</span>
      </div>

      <h1 class="text-lg md:text-2xl font-extrabold text-gray-800 mb-1">Paso 3 de 5: Selección de Médico</h1>
      <p class="text-gray-500 text-sm mb-5">Elija al profesional de salud que le atenderá.</p>

      <div id="listaMedicos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <p id="errorMsg" class="text-sm text-red-600 hidden mt-2"></p>

      <button onclick="window.location.href='nueva-cita-paso2.html'" class="w-full md:max-w-xs text-gray-600 font-semibold rounded-lg py-3 border border-gray-200 mt-4 hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Volver
      </button>

      <button onclick="App.mostrarSoporte()" class="w-full text-center text-xs text-gray-400 mt-6 flex items-center justify-center gap-1 hover:text-blue-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.436 3 11.998c0 4.557 4.03 8.252 9 8.252zm0 0c1.786 0 3.443-.538 4.81-1.455M12 20.25v-3.75m0 3.75A9.92 9.92 0 017.19 18.8m4.81 1.45V16.5m0-4.5c.828 0 1.5.672 1.5 1.5M12 12c-.828 0-1.5.672-1.5 1.5" />
        </svg>
        Soporte Técnico MINSA
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    App.requiereSesion("ciudadano", "login-ciudadano.html");
    const wizard = DB.getWizard();
    if (!wizard.especialidadId) window.location.href = "nueva-cita-paso2.html";

    const medicos = DB.getMedicosPorEspecialidad(wizard.especialidadId);
    const especialidad = DB.getEspecialidadPorId(wizard.especialidadId);
    const cont = document.getElementById("listaMedicos");

    const iconUserPlaceholder = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-16 h-16 text-gray-300"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>`;
    const iconBuilding = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-gray-400 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z" /></svg>`;

    if (medicos.length === 0) {
      cont.innerHTML = `<p class="text-gray-400 text-sm text-center py-8 col-span-full">No hay médicos disponibles para esta especialidad por el momento.</p>`;
    } else {
      cont.innerHTML = medicos
        .map(
          (m) => `
        <div class="border border-gray-200 rounded-lg overflow-hidden hover:shadow-md transition-shadow">
          ${
            m.foto
              ? `<img src="${m.foto}" class="w-full h-40 object-cover" alt="${m.nombre}">`
              : `<div class="w-full h-40 bg-gray-100 flex items-center justify-center">${iconUserPlaceholder}</div>`
          }
          <div class="p-4">
            <p class="font-bold text-gray-800">${m.nombre}</p>
            <p class="text-sm text-gray-500 mb-1">Especialidad: ${especialidad ? especialidad.nombre : ""}</p>
            <p class="text-sm text-gray-500 mb-3 flex items-center gap-1">${iconBuilding} Consultorio ${m.consultorio}</p>
            <button onclick="elegirMedico('${m.id}')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg py-2.5 transition-colors hover:shadow-md flex items-center justify-center gap-2">
              Elegir Médico
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </button>
          </div>
        </div>`
        )
        .join("");
    }

    function elegirMedico(medicoId) {
      DB.guardarWizard({ medicoId });
      window.location.href = "nueva-cita-paso4.html";
    }
  </script>
</body>
</html>
