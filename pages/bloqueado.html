<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Acceso Bloqueado</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white border-2 border-red-200 min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-2 px-6 py-4 border-b border-gray-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 md:p-10 flex-1 overflow-y-auto flex flex-col justify-center">
      <div class="max-w-lg mx-auto w-full text-center">
        <div class="mx-auto mb-4 bg-red-100 rounded-lg w-16 h-16 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" class="h-8 w-8 text-red-600" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/>
          </svg>
        </div>

        <h1 class="text-red-600 font-extrabold text-xl leading-tight mb-3">
          Acceso Temporalmente Bloqueado por Seguridad
        </h1>
        <p class="text-gray-500 text-sm leading-relaxed mb-5">
          Se han detectado 3 intentos fallidos de inicio de sesión. Por su seguridad, su cuenta ha sido congelada temporalmente.
        </p>

        <div class="bg-gray-100 rounded-lg py-4 mb-6">
          <p class="text-xs text-gray-500 font-semibold mb-1">TIEMPO RESTANTE</p>
          <p id="contador" class="text-3xl font-mono font-bold text-gray-800">15:00</p>
        </div>

        <button onclick="window.location.href='recuperar-acceso.html'" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 mb-3 flex items-center justify-center gap-2 transition-colors hover:shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
          Recuperar Contraseña por Correo o SMS
        </button>
        <button id="btnReintentar" disabled class="w-full border border-gray-300 text-gray-400 font-semibold rounded-lg py-3 flex items-center justify-center gap-2 cursor-not-allowed transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
          </svg>
          Volver a intentar
        </button>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script>
    function actualizarContador() {
      const intentos = DB.getIntentos();
      const restante = (intentos.bloqueadoHasta || 0) - Date.now();

      if (restante <= 0) {
        DB.resetIntentos();
        document.getElementById("contador").textContent = "00:00";
        const btn = document.getElementById("btnReintentar");
        btn.disabled = false;
        btn.classList.remove("border-gray-300", "text-gray-400", "cursor-not-allowed");
        btn.classList.add("border-blue-900", "text-blue-900");
        btn.onclick = () => (window.location.href = "login-ciudadano.html");
        clearInterval(intervalo);
        return;
      }

      const min = Math.floor(restante / 60000);
      const seg = Math.floor((restante % 60000) / 1000);
      document.getElementById("contador").textContent =
        `${String(min).padStart(2, "0")}:${String(seg).padStart(2, "0")}`;
    }

    // Si no hay bloqueo activo, no debería estar aquí
    if (!DB.getIntentos().bloqueadoHasta) {
      DB.registrarIntentoFallido();
      DB.registrarIntentoFallido();
      DB.registrarIntentoFallido();
    }

    actualizarContador();
    const intervalo = setInterval(actualizarContador, 1000);
  </script>
</body>
</html>
