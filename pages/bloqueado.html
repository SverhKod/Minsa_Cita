<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Acceso Bloqueado</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl border-2 border-red-200 shadow-md overflow-hidden fade-in" style="max-width:384px;margin:0 auto;">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 text-center">
      <div class="mx-auto mb-4 bg-red-100 rounded-lg w-16 h-16 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" class="h-8 w-8 text-red-600" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 1 1 6 0v3H9z"/>
        </svg>
      </div>

      <h1 class="text-red-600 font-extrabold text-xl leading-tight mb-3">
        Acceso Temporalmente Bloqueado por Seguridad
      </h1>
      <p class="text-gray-500 text-sm leading-relaxed mb-5">
        Se han detectado 3 intentos fallidos de inicio de sesión. Por su seguridad, su cuenta ha sido congelada temporalmente.
      </p>

      <div class="bg-gray-100 rounded-lg py-4 mb-6">
        <p class="text-xs text-gray-500 font-semibold mb-1">TIEMPO RESTANTE</p>
        <p id="contador" class="text-3xl font-mono font-bold text-gray-800">15:00</p>
      </div>

      <button onclick="window.location.href='recuperar-acceso.html'" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 mb-3 flex items-center justify-center gap-2">
        ✉️ Recuperar Contraseña por Correo o SMS
      </button>
      <button id="btnReintentar" disabled class="w-full border border-gray-300 text-gray-400 font-semibold rounded-lg py-3 flex items-center justify-center gap-2 cursor-not-allowed">
        ⟳ Volver a intentar
      </button>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script>
    function actualizarContador() {
      const intentos = DB.getIntentos();
      const restante = (intentos.bloqueadoHasta || 0) - Date.now();

      if (restante <= 0) {
        DB.resetIntentos();
        document.getElementById("contador").textContent = "00:00";
        const btn = document.getElementById("btnReintentar");
        btn.disabled = false;
        btn.classList.remove("border-gray-300", "text-gray-400", "cursor-not-allowed");
        btn.classList.add("border-blue-900", "text-blue-900");
        btn.onclick = () => (window.location.href = "login-ciudadano.html");
        clearInterval(intervalo);
        return;
      }

      const min = Math.floor(restante / 60000);
      const seg = Math.floor((restante % 60000) / 1000);
      document.getElementById("contador").textContent =
        `${String(min).padStart(2, "0")}:${String(seg).padStart(2, "0")}`;
    }

    // Si no hay bloqueo activo, no debería estar aquí
    if (!DB.getIntentos().bloqueadoHasta) {
      DB.registrarIntentoFallido();
      DB.registrarIntentoFallido();
      DB.registrarIntentoFallido();
    }

    actualizarContador();
    const intervalo = setInterval(actualizarContador, 1000);
  </script>
</body>
</html>
