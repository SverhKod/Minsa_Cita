<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Acceso Personal Técnico</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200 shrink-0">
      <button onclick="window.location.href='../index.html'" class="text-gray-600 hover:text-blue-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      </button>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 md:p-10 flex-1 overflow-y-auto flex flex-col justify-center">
      <div class="max-w-lg mx-auto w-full">
        <h1 class="text-xl md:text-2xl font-extrabold text-gray-800 mb-1">Acceso Personal Técnico</h1>
        <p class="text-gray-500 text-sm mb-6">Ingrese sus credenciales institucionales otorgadas por su establecimiento de salud.</p>

        <form id="formLogin" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Código de Personal</label>
            <input id="codigo" type="text" placeholder="Ej: TEC001"
              class="w-full border border-gray-300 rounded-lg px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
            <p class="text-xs text-gray-400 mt-1">Prueba con TEC001 / 1234</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
            <input id="password" type="password" placeholder="Ingrese su contraseña"
              class="w-full border border-gray-300 rounded-lg px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
          </div>

          <p id="errorMsg" class="text-sm text-red-600 hidden"></p>

          <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 transition-colors hover:shadow-md">
            INGRESAR
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();
      const errorEl = document.getElementById("errorMsg");
      errorEl.classList.add("hidden");

      const codigo = document.getElementById("codigo").value.trim();
      const password = document.getElementById("password").value;
      const tecnico = DB.getTecnicoPorCodigo(codigo);

      if (!tecnico || tecnico.password !== password) {
        errorEl.textContent = "Código o contraseña incorrectos.";
        errorEl.classList.remove("hidden");
        return;
      }

      DB.login("tecnico", { codigo });
      window.location.href = "tecnico-inicio.html";
    });
  </script>
</body>
</html>
