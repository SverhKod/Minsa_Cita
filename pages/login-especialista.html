<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Acceso Personal Técnico</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden fade-in" style="max-width:384px;margin:0 auto;">

    <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-200">
      <button onclick="window.location.href='../index.html'" class="text-gray-600">←</button>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6">
      <h1 class="text-xl font-extrabold text-gray-800 mb-1">Acceso Personal Técnico</h1>
      <p class="text-gray-500 text-sm mb-6">Ingrese sus credenciales institucionales otorgadas por su establecimiento de salud.</p>

      <form id="formLogin" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Código de Personal</label>
          <input id="codigo" type="text" placeholder="Ej: TEC001"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
          <p class="text-xs text-gray-400 mt-1">Prueba con TEC001 / 1234</p>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
          <input id="password" type="password" placeholder="Ingrese su contraseña"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800">
        </div>

        <p id="errorMsg" class="text-sm text-red-600 hidden"></p>

        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3">
          INGRESAR
        </button>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();
      const errorEl = document.getElementById("errorMsg");
      errorEl.classList.add("hidden");

      const codigo = document.getElementById("codigo").value.trim();
      const password = document.getElementById("password").value;
      const tecnico = DB.getTecnicoPorCodigo(codigo);

      if (!tecnico || tecnico.password !== password) {
        errorEl.textContent = "Código o contraseña incorrectos.";
        errorEl.classList.remove("hidden");
        return;
      }

      DB.login("tecnico", { codigo });
      window.location.href = "tecnico-inicio.html";
    });
  </script>
</body>
</html>
