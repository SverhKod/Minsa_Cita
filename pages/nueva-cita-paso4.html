<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Fecha y Hora</title>
<link rel="stylesheet" href="../css/tailwind.css">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-xl shadow-md overflow-hidden fade-in" style="max-width:384px;margin:0 auto;">

    <div class="flex items-center gap-2 px-4 py-3 border-b border-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-blue-900" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </svg>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6">
      <div class="flex items-center gap-1 mb-6 text-xs">
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">✓</span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">✓</span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">✓</span>
        <span class="flex-1 h-0.5 bg-blue-900"></span>
        <span class="w-6 h-6 rounded-full bg-blue-900 text-white flex items-center justify-center">4</span>
        <span class="flex-1 h-0.5 bg-gray-200"></span>
        <span class="w-6 h-6 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">5</span>
      </div>

      <h1 class="text-lg font-extrabold text-gray-800 mb-1">Seleccione Fecha y Hora</h1>
      <p class="text-gray-500 text-sm mb-4">Elija el día y el horario disponible para su cita médica.</p>

      <!-- Calendario -->
      <div class="border border-gray-200 rounded-lg p-3 mb-5">
        <div class="flex items-center justify-between mb-2">
          <button onclick="cambiarMes(-1)" class="text-gray-500 px-2">‹</button>
          <span id="mesLabel" class="font-semibold text-sm text-gray-700"></span>
          <button onclick="cambiarMes(1)" class="text-gray-500 px-2">›</button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-400 mb-1">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div id="diasGrid" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
        <div class="flex items-center gap-4 mt-3 text-xs text-gray-500">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-blue-100 inline-block"></span> Disponible</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-blue-900 inline-block"></span> Seleccionado</span>
        </div>
      </div>

      <!-- Horarios -->
      <div class="mb-2">
        <p class="font-bold text-gray-800 mb-1">Horarios Disponibles</p>
        <p id="diaSeleccionadoLabel" class="text-sm text-gray-500 mb-3">Seleccione un día del calendario.</p>
        <div id="horariosGrid" class="grid grid-cols-3 gap-2"></div>
      </div>

      <p id="errorMsg" class="text-sm text-red-600 hidden mt-3"></p>

      <div class="flex gap-3 mt-6">
        <button onclick="window.location.href='nueva-cita-paso3.html'" class="flex-1 text-gray-600 font-semibold rounded-lg py-3 border border-gray-200">
          Atrás
        </button>
        <button onclick="siguiente()" class="flex-1 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3">
          Siguiente →
        </button>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
  <script>
    App.requiereSesion("ciudadano", "login-ciudadano.html");
    const wizard = DB.getWizard();
    if (!wizard.medicoId) window.location.href = "nueva-cita-paso3.html";

    const HORAS = ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","14:00","14:30","15:00","15:30"];
    const HORAS_OCUPADAS = ["09:00"]; // simulación de horario ya tomado

    let mesActual = new Date();
    mesActual.setDate(1);
    let fechaSeleccionada = null;
    let horaSeleccionada = null;

    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    function cambiarMes(delta) {
      mesActual.setMonth(mesActual.getMonth() + delta);
      renderCalendario();
    }

    function renderCalendario() {
      document.getElementById("mesLabel").textContent = `${meses[mesActual.getMonth()]} ${mesActual.getFullYear()}`;
      const grid = document.getElementById("diasGrid");
      grid.innerHTML = "";

      const primerDia = new Date(mesActual.getFullYear(), mesActual.getMonth(), 1);
      const diasEnMes = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 0).getDate();
      let diaSemana = primerDia.getDay(); // 0=domingo
      diaSemana = diaSemana === 0 ? 6 : diaSemana - 1; // convertir a lunes=0

      const hoy = new Date();
      hoy.setHours(0,0,0,0);

      for (let i = 0; i < diaSemana; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= diasEnMes; d++) {
        const fecha = new Date(mesActual.getFullYear(), mesActual.getMonth(), d);
        const btn = document.createElement("button");
        btn.textContent = d;
        const esPasado = fecha < hoy;
        const esDomingo = fecha.getDay() === 0;
        const key = fecha.toISOString().slice(0,10);
        const seleccionado = fechaSeleccionada === key;

        btn.className = "py-1.5 rounded-md " + (
          esPasado || esDomingo
            ? "text-gray-300 cursor-not-allowed"
            : seleccionado
              ? "bg-blue-900 text-white font-semibold"
              : "bg-blue-100 text-blue-900 hover:bg-blue-200"
        );

        if (!esPasado && !esDomingo) {
          btn.onclick = () => {
            fechaSeleccionada = key;
            horaSeleccionada = null;
            renderCalendario();
            renderHorarios();
          };
        } else {
          btn.disabled = true;
        }
        grid.appendChild(btn);
      }
    }

    function renderHorarios() {
      const label = document.getElementById("diaSeleccionadoLabel");
      const grid = document.getElementById("horariosGrid");
      grid.innerHTML = "";

      if (!fechaSeleccionada) {
        label.textContent = "Seleccione un día del calendario.";
        return;
      }

      const fechaObj = new Date(fechaSeleccionada + "T00:00:00");
      label.innerHTML = `Día seleccionado: <span class="font-semibold text-blue-900">${App.formatoFechaLarga(fechaObj)}</span>`;

      HORAS.forEach((h) => {
        const ocupado = HORAS_OCUPADAS.includes(h);
        const btn = document.createElement("button");
        btn.textContent = h;
        const seleccionado = horaSeleccionada === h;
        btn.className = "py-2 rounded-lg border text-sm " + (
          ocupado
            ? "border-gray-200 text-gray-300 cursor-not-allowed"
            : seleccionado
              ? "bg-blue-900 text-white border-blue-900 font-semibold"
              : "border-gray-300 text-gray-700 hover:border-blue-900"
        );
        if (!ocupado) {
          btn.onclick = () => {
            horaSeleccionada = h;
            renderHorarios();
          };
        } else {
          btn.disabled = true;
        }
        grid.appendChild(btn);
      });
    }

    function siguiente() {
      const errorEl = document.getElementById("errorMsg");
      errorEl.classList.add("hidden");
      if (!fechaSeleccionada || !horaSeleccionada) {
        errorEl.textContent = "Seleccione una fecha y un horario disponible.";
        errorEl.classList.remove("hidden");
        return;
      }
      const fechaObj = new Date(fechaSeleccionada + "T00:00:00");
      DB.guardarWizard({ fecha: App.formatoFechaLarga(fechaObj), hora: horaSeleccionada });
      window.location.href = "nueva-cita-paso5.html";
    }

    renderCalendario();
  </script>
</body>
</html>
