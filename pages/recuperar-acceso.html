<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita - Recuperar Acceso</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-md md:max-w-2xl mx-auto bg-white min-h-screen md:min-h-[80vh] md:rounded-xl md:shadow-2xl overflow-hidden fade-in flex flex-col transition-all duration-300">

    <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200 shrink-0">
      <button onclick="window.location.href='login-ciudadano.html'" class="text-gray-600 hover:text-blue-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      </button>
      <span class="text-sm font-bold text-blue-900 tracking-wide">MINSACITA</span>
    </div>

    <div class="p-6 md:p-10 flex-1 overflow-y-auto flex flex-col justify-center">
      <div class="max-w-lg mx-auto w-full">
        <h1 class="text-xl md:text-2xl font-extrabold text-gray-800 text-center mb-1">Recuperar Acceso</h1>
        <p class="text-gray-500 text-sm text-center mb-6">Ingrese su documento de identidad y seleccione cómo desea recibir el código de verificación.</p>

        <form id="formRecuperar" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Número de DNI</label>
            <input id="dni" type="text" maxlength="8" placeholder="Ej: 12345678"
              class="w-full border border-gray-300 rounded-lg px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-800 transition-all">
          </div>

          <div>
            <p class="text-sm font-semibold text-gray-700 mb-2">Método de envío</p>
            <label class="flex items-center gap-3 border border-gray-200 rounded-lg p-3 mb-2 cursor-pointer hover:border-blue-300 transition-colors">
              <input type="radio" name="metodo" value="sms" checked class="text-blue-900">
              <span class="text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" />
                </svg>
              </span>
              <span class="text-sm text-gray-700">Mensaje de Texto (SMS)<br><span class="text-xs text-gray-400">Al celular registrado terminado en **45</span></span>
            </label>
            <label class="flex items-center gap-3 border border-gray-200 rounded-lg p-3 cursor-pointer hover:border-blue-300 transition-colors">
              <input type="radio" name="metodo" value="correo" class="text-blue-900">
              <span class="text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
              </span>
              <span class="text-sm text-gray-700">Correo Electrónico<br><span class="text-xs text-gray-400">A j***@gmail.com</span></span>
            </label>
          </div>

          <p id="mensaje" class="text-sm hidden"></p>

          <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-lg py-3 transition-colors hover:shadow-md">
            Enviar Código
          </button>
          <button type="button" onclick="window.location.href='login-ciudadano.html'" class="w-full border border-gray-300 text-gray-700 font-semibold rounded-lg py-3 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script>
    document.getElementById("formRecuperar").addEventListener("submit", function (e) {
      e.preventDefault();
      const dni = document.getElementById("dni").value.trim();
      const mensaje = document.getElementById("mensaje");

      if (!dni) {
        mensaje.textContent = "Ingrese su número de DNI.";
        mensaje.className = "text-sm text-red-600";
        mensaje.classList.remove("hidden");
        return;
      }

      const metodo = document.querySelector('input[name="metodo"]:checked').value;
      mensaje.textContent = `Código de verificación enviado por ${metodo === "sms" ? "SMS" : "correo electrónico"} (simulación). Revise su bandeja de entrada.`;
      mensaje.className = "text-sm text-green-700";
      mensaje.classList.remove("hidden");

      DB.resetIntentos();

      setTimeout(() => {
        window.location.href = "login-ciudadano.html";
      }, 2500);
    });
  </script>
</body>
</html>
