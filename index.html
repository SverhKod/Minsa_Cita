<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MinsaCita</title>
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100">

  <div class="w-full max-w-sm mx-auto bg-white h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-200 shrink-0">
      <div class="bg-blue-900 rounded-md p-2 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
        </svg>
      </div>
      <span class="text-xs font-semibold text-gray-700 tracking-wide">MINISTERIO DE SALUD DEL PERÚ</span>
    </div>

    <!-- Body -->
    <div class="p-6 flex-1 overflow-y-auto">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-blue-900">MinsaCita</h1>
        <p class="text-gray-500 mt-2">Sistema Nacional de Citas Médicas</p>
      </div>

      <!-- Módulo Ciudadano -->
      <button onclick="App.seleccionarRolCiudadano()"
        class="w-full bg-blue-900 hover:bg-blue-800 transition-colors rounded-lg py-8 px-4 mb-5 flex flex-col items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" class="h-10 w-10 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
        </svg>
        <span class="text-white font-semibold text-center leading-tight">
          Módulo Ciudadano<br>(Paciente)
        </span>
      </button>

      <!-- Módulo Especialista -->
      <button onclick="App.seleccionarRolEspecialista()"
        class="w-full border-2 border-blue-900 hover:bg-blue-50 transition-colors rounded-lg py-8 px-4 mb-6 flex flex-col items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" class="h-10 w-10 text-blue-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 3v6a4 4 0 0 0 8 0V3"/>
          <path d="M12.5 9v3a6 6 0 0 1-12 0v-1"/>
          <circle cx="19.5" cy="8" r="2.5"/>
          <path d="M19.5 10.5V13a7 7 0 0 1-7 7"/>
        </svg>
        <span class="text-blue-900 font-semibold text-center leading-tight">
          Módulo Especialista<br>(Personal Técnico)
        </span>
      </button>

      <!-- Info box -->
      <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 flex gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" class="h-5 w-5 text-gray-500 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        <div>
          <p class="font-semibold text-gray-700 text-sm mb-1">Información de Ingreso</p>
          <p class="text-gray-500 text-sm leading-relaxed">
            Seleccione su rol para continuar. Los ciudadanos ingresan con su DNI. El personal técnico requiere credenciales institucionales otorgadas por su establecimiento de salud.
          </p>
        </div>
      </div>

    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
